# Publica hoy.json (noticias de alto impacto + próximos directos) en la rama
# `data`, para la columna "Hoy" de la app. Ver .github/scripts/datos-hoy.mjs.
#
# - Cada 6 horas, y a mano desde la pestaña Actions ("Run workflow").
# - La rama `data` tiene siempre UN solo commit (se sobrescribe): no ensucia
#   el historial de main ni dispara el despliegue de GitHub Pages.
# - Directos: hace falta el secreto CLASES_ICS_URL (Settings → Secrets and
#   variables → Actions) con la "dirección secreta en formato iCal" del
#   calendario "Tradinverso Clases". Sin él, solo se publican las noticias.
name: Datos de Hoy (noticias y directos)

on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/datos-hoy.yml'
      - '.github/scripts/datos-hoy.mjs'

permissions:
  contents: write

concurrency:
  group: datos-hoy
  cancel-in-progress: true

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias (lector de calendarios iCal)
        run: npm install --no-save --no-audit --no-fund ical-expander@3.1.0
      - name: Generar hoy.json
        run: node .github/scripts/datos-hoy.mjs
        env:
          CLASES_ICS_URL: ${{ secrets.CLASES_ICS_URL }}
          # 'si' = publicar también el enlace (Zoom) de cada directo. hoy.json es
          # un archivo PÚBLICO: activado por decisión de David (2026-11-11),
          # sabiendo que el enlace queda visible para quien tenga la dirección.
          # Para dejar de publicarlos, poner 'no'.
          CLASES_PUBLICAR_ENLACES: 'si'
      - name: Publicar en la rama data
        run: |
          mkdir out && cp hoy.json out/ && cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hoy.json
          git commit -q -m "Datos de Hoy"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
